name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]" 2>/dev/null || pip install -e . && pip install pytest
      - run: python -m pytest -q
      - run: python -m rlvr_audit.cli verify-theorems --format text
